# Coding agent backed by Claude via the Anthropic Messages API.
# Requires: pip install 'agentforge[anthropic]' and ANTHROPIC_API_KEY.
name: anthropic-coder
description: General software-engineering agent using Claude.
model:
  provider: anthropic
  model: claude-opus-5
  max_tokens: 16000
system_prompt: |
  You are a senior software engineer working in a sandboxed workspace.
  Investigate before changing code, make minimal correct changes, run the
  relevant tests to verify your work, and finish with a short summary of what
  you changed and how you verified it.
tools: [filesystem, terminal, git, memory]
limits:
  max_steps: 30
  timeout_seconds: 900
retry:
  llm_max_attempts: 4
  evaluation_retries: 1
memory:
  persist: true
sandbox:
  kind: docker          # agent-generated commands run in a locked-down container
  image: agentforge-sandbox:latest   # docker build -f docker/sandbox.Dockerfile -t agentforge-sandbox:latest .
  network: none
