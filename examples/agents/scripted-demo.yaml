# Deterministic demo agent.
#
# The "scripted" provider replays the turns below instead of calling a model,
# so the full pipeline (runtime -> tools -> evaluation -> storage -> dashboard)
# can be exercised offline and in CI. Its results say nothing about any real
# model. Scripts are selected by matching the goal text.
name: scripted-demo
description: Offline demo agent that replays scripted solutions to the starter benchmark.
model:
  provider: scripted
  model: scripted-v1
  options:
    turns:
      - text: "I only have scripts for the starter benchmark tasks."
    rules:
      - when: "hello\\.txt"
        turns:
          - text: "I'll create the greeting file."
            tool_calls:
              - name: write_file
                arguments: {path: hello.txt, content: "Hello, AgentForge!\n"}
          - text: "Created hello.txt with the greeting."
      - when: "test_calc\\.py"
        turns:
          - text: "First, reproduce the failure."
            tool_calls:
              - name: run_command
                arguments: {command: python3 test_calc.py}
          - text: "The add assertion fails. Let me inspect calc.py."
            tool_calls:
              - name: read_file
                arguments: {path: calc.py}
          - text: "add() subtracts instead of adding. Fixing it."
            tool_calls:
              - name: edit_file
                arguments: {path: calc.py, old_text: "return a - b", new_text: "return a + b"}
          - text: "Re-running the tests."
            tool_calls:
              - name: run_command
                arguments: {command: python3 test_calc.py}
          - text: "Fixed add() in calc.py (it used subtraction); all tests pass now."
      - when: "data\\.csv"
        turns:
          - tool_calls:
              - name: read_file
                arguments: {path: data.csv}
          - text: "There are 5 data rows."
            tool_calls:
              - name: write_file
                arguments: {path: answer.txt, content: "5\n"}
          - text: "Wrote 5 to answer.txt."
      - when: "feature/readme"
        turns:
          - tool_calls:
              - name: git_branch
                arguments: {name: feature/readme}
          - tool_calls:
              - name: write_file
                arguments:
                  path: README.md
                  content: "# Demo app\n\nA tiny demo application used by the AgentForge starter benchmark.\n"
          - tool_calls:
              - name: git_commit
                arguments: {message: "Add README"}
          - text: "Created feature/readme with a committed README.md."
tools: [filesystem, terminal, git]
limits:
  max_steps: 15
  timeout_seconds: 120
sandbox:
  kind: local
labels:
  purpose: demo
