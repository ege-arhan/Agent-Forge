# Google Gemini through its native generateContent API.
# Requires: GEMINI_API_KEY (no optional extra: the adapter uses httpx directly).
name: gemini-agent
model:
  provider: gemini
  model: YOUR_GEMINI_MODEL
tools: [filesystem, terminal]
sandbox:
  kind: docker
  image: agentforge-sandbox:latest   # includes git and pytest; see docker/sandbox.Dockerfile
