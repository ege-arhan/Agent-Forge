[project]
name = "agentforge"
version = "0.2.0"
description = "An agent engineering and evaluation platform: build, run, observe, evaluate and benchmark LLM agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "AgentForge contributors" }]
keywords = ["agents", "llm", "evaluation", "benchmarks", "ai-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fastapi>=0.142.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0,<2"]
openai = ["openai>=2.0,<4"]
postgres = ["asyncpg>=0.29"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]
all = ["agentforge[anthropic,openai,postgres,otel]"]

[project.scripts]
agentforge = "agentforge.cli:main"

[project.urls]
Repository = "https://github.com/ege-arhan/Agent-Forge"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "anthropic>=1.0,<2",
    "openai>=2.0,<4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that exercise several components together (still offline)",
    "docker: tests that require a running Docker daemon",
    "e2e: end-to-end tests through the HTTP API or CLI",
]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "PL",
]
ignore = [
    "PLR0913", # agent/tool constructors legitimately take many options
    "PLR2004", # magic values in comparisons are fine for status codes etc.
    "PLR0911",
    "PLR0912",
    "PLC0415", # lazy imports are used deliberately for optional provider SDKs
    "RET504",
    "PLW0603", # module-level lazy singletons (registries) use `global`
    "PLR0915", # the agent loop is intentionally one readable function
    "ASYNC109", # sandbox APIs implement their own timeout semantics
]

[tool.ruff.lint.per-file-ignores]
"src/agentforge/storage/migrations/versions/*" = ["E501"]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "PLR0915", "ASYNC", "PT018", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentforge"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["agentforge"]
branch = true
