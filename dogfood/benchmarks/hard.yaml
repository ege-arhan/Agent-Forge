    name: hidden_existing_behaviour
    command: |
      python3 - <<'PY'
      import os, tempfile
      from settings import DEFAULTS, load_settings, parse
      for k in [k for k in os.environ if k.startswith("APP_")]:
          del os.environ[k]
      v = parse("A = 1.5\nurl = http://x/#frag\ncolor = #fff\nname = \"x y\"  # c\nRetries = -3\nflag = ON\nq = 'unbalanced\"\nport = 1\nport = 2\n\n; x\n  # y\n")
      assert v == {"a": "1.5", "url": "http://x/#frag", "color": "", "name": "x y", "retries": -3, "flag": True, "q": "'unbalanced\"", "port": 2}, v
      try:
          parse("oops")
      except ValueError:
          pass
      else:
          raise AssertionError("line without '=' must raise ValueError")
      assert load_settings() == DEFAULTS
      assert load_settings("app.ini") == {**DEFAULTS, "host": "example.org", "port": 8080, "debug": False, "db.url": "postgresql://db/app", "theme": "ocean"}, load_settings("app.ini")
      assert load_settings(overrides={"Port": 5})["port"] == 5
      print("legacy ok")
      PY
  - type: command
    name: hidden_env_rules
    command: |
      python3 - <<'PY'
      import os
      from settings import DEFAULTS, load_settings
      env = {"APP_PORT": "9100", "APP_LOG_LEVEL": "debug", "APP_DB_URL": "'postgresql://env/db'", "APP_DEBUG": "True",
             "APP_WORKERS": "", "APP_THEME": "dark", "APP_EXTRA": "1", "PORT": "1"}
      s = load_settings("app.ini", env=env)
      assert s["port"] == 9100 and s["log-level"] == "debug" and s["db.url"] == "postgresql://env/db", s
      assert s["debug"] is True and s["workers"] == 2 and s["theme"] == "dark", s
      assert "extra" not in s and set(s) == set(DEFAULTS) | {"theme"}, s
      s = load_settings("app.ini", overrides={"port": 1, "theme": "light"}, env=env)
      assert s["port"] == 1 and s["theme"] == "light"
      assert load_settings(env={"APP_THEME": "dark"}) == DEFAULTS  # theme is not a known key without the file
      os.environ["APP_HOST"] = "from-os-environ"
      try:
          assert load_settings()["host"] == "from-os-environ"
          assert load_settings(env={})["host"] == "localhost"
      finally:
          del os.environ["APP_HOST"]
      print("env ok")
