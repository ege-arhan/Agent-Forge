- id: env-overrides
  goal: Implement CHANGE.md (environment variable overrides for settings.py) without changing any existing
    behaviour, and add tests for the new behaviour.
  setup:
    files:
      CHANGE.md: |
        # Change request: environment variable overrides

        Deployments need to override settings from the environment.

        - `load_settings(path=None, overrides=None, env=None)`: new optional `env`
          mapping; when it is `None`, use `os.environ`.
        - For every known key (a key in `DEFAULTS` or in the file), the environment
          variable `APP_` + the key upper-cased with `.` and `-` replaced by `_`
          overrides the value. Examples: `port` -> `APP_PORT`, `db.url` -> `APP_DB_URL`,
          `log-level` -> `APP_LOG_LEVEL`.
        - Environment values are converted exactly like values from the file.
        - An environment variable set to the empty string is ignored.
        - Other `APP_*` variables are ignored: the environment never adds new keys.
        - Precedence, lowest to highest: `DEFAULTS` < file < environment < `overrides`.

        Everything that works today must keep working exactly as it does (the file
        format and its documented rules, `parse`, `load_settings` without environment
        variables). Keep the existing tests unchanged and add tests for the new
        behaviour to `tests/test_settings.py`. `python3 -m unittest discover -s tests`
        must pass.
      app.ini: |
        # Production settings
        host = example.org
        port = 8080
        DEBUG = off
        db.url = "postgresql://db/app"   # primary database
        theme = ocean
      settings.py: |
        """Application settings.

        File format: one `key = value` per line. Blank lines and lines starting with
        `#` or `;` are ignored, and ` #` (a space followed by `#`) starts an inline
        comment. Keys are case-insensitive. Values are converted: integers (`-?[0-9]+`)
        become `int`; true/false/yes/no/on/off (any case) become `bool`; anything
        else stays a string, with one pair of matching surrounding quotes removed.
        When a key appears twice, the later line wins. A line without `=` is an error.
        """

        import re

        DEFAULTS = {
            "host": "localhost",
            "port": 8000,
            "debug": False,
            "workers": 2,
            "db.url": "sqlite:///app.db",
            "log-level": "info",
        }

        _INT = re.compile(r"-?[0-9]+")
        _BOOLS = {"true": True, "yes": True, "on": True, "false": False, "no": False, "off": False}


        def convert(raw: str) -> object:
            value = raw.strip()
            if _INT.fullmatch(value):
                return int(value)
            if value.lower() in _BOOLS:
                return _BOOLS[value.lower()]
            if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                return value[1:-1]
            return value


        def parse(text: str) -> dict[str, object]:
            values: dict[str, object] = {}
            for line in text.splitlines():
                stripped = line.strip()
                if not stripped or stripped[0] in "#;":
                    continue
                if " #" in stripped:
                    stripped = stripped[: stripped.index(" #")].rstrip()
                key, sep, raw = stripped.partition("=")
                if not sep:
                    raise ValueError(f"invalid line: {line!r}")
                values[key.strip().lower()] = convert(raw)
            return values


        def load_settings(path: str | None = None, overrides: dict[str, object] | None = None) -> dict[str, object]:
            """DEFAULTS, updated by the file at `path`, updated by `overrides` (highest precedence)."""
            settings: dict[str, object] = dict(DEFAULTS)
            if path is not None:
                with open(path) as handle:
                    settings.update(parse(handle.read()))
            for key, value in (overrides or {}).items():
                settings[key.lower()] = value
            return settings
      tests/__init__.py: ''
      tests/test_settings.py: |
        import os
        import tempfile
        import unittest

        from settings import DEFAULTS, load_settings, parse


        class ParseTests(unittest.TestCase):
            def test_types_and_comments(self):
                values = parse("# c\nport = 9000\ndebug = Yes\nname = 'shop'\n; other\n")
                self.assertEqual(values, {"port": 9000, "debug": True, "name": "shop"})

            def test_inline_comment(self):
                self.assertEqual(parse("host = a.example   # note")["host"], "a.example")


        class LoadTests(unittest.TestCase):
            def test_defaults(self):
                self.assertEqual(load_settings(), DEFAULTS)

            def test_file_then_overrides(self):
                with tempfile.NamedTemporaryFile("w", suffix=".ini", delete=False) as handle:
                    handle.write("port = 9000\nworkers = 4\n")
                try:
                    settings = load_settings(handle.name, overrides={"workers": 8})
                finally:
                    os.unlink(handle.name)
                self.assertEqual((settings["port"], settings["workers"]), (9000, 8))


        if __name__ == "__main__":
            unittest.main()
  allowed_tools:
  - filesystem
  - terminal
  expected_behavior: Add the env parameter, map known keys to APP_* names, convert values like the file,
