- id: skip-dates
  goal: |
    Implement this feature request in the `flowcal` repository (the workspace; start with README.md).

    **Skip single dates of an event**

    I need to cancel one occurrence of a repeating event without ending the series.

    - `Event` gets a field `skip`: a tuple of `datetime.date`, empty by default, kept sorted
      and without duplicates. An occurrence that starts on one of these dates does not happen:
      it is not in the agenda, cannot conflict and is never the next occurrence.
    - A skipped occurrence still counts towards the rule's `count`: a daily event with
      `count: 5` and one skipped date happens four times.
    - In the calendar file an event may have `"skip": ["YYYY-MM-DD", ...]`. Files without it
      load as before. An event without skipped dates is written exactly as today (no `skip`
      key), so saving an existing calendar does not change the file.
    - New command `python3 -m flowcal [--file F] skip EVENT_ID DATE` adds the date and saves
      the file. It prints `skipped EVENT_ID on DATE` and exits 0. If the date is already
      skipped it prints `already skipped EVENT_ID on DATE`, exits 0 and leaves the file alone.
      If the event has no occurrence starting on that date: `error: EVENT_ID has no occurrence
      on DATE` on stderr, exit status 2, file unchanged (an unknown event id is reported the
      way `next` reports it).

    Do not change the shipped `calendar.json`. The existing tests must keep passing
    (`python3 -m unittest discover -s tests`).
  setup:
    files: *flowcal_repo
    git_init: true
  allowed_tools:
  - filesystem
  - terminal
  - git
  expected_behavior: Add `Event.skip` (model), read and write it (store, no key when empty), leave skipped
    starts out of `occurrences` and `next_occurrence` while they still count towards `count`, and add
    the `skip` command with its messages and exit codes.
  evaluators:
  - type: completed
    name: finished
  - type: command
    name: unit_tests
    command: python3 -m unittest discover -s tests
  - type: command
    name: existing_tests
    command: |
