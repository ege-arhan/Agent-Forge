# Dogfooding suite: issues in a multi-module repository (suite collection "dogfood", see dogfood/README.md).
#
# Three tasks share one repository, `flowcal` (six modules, 28 tests, a data
# file, a README that documents the intended behaviour). Each task's goal is
# an issue; the agent is not told what the checks are. Checks per task:
#   unit_tests      the tests in the workspace pass (whatever the agent made of them)
#   existing_tests  the repository's ORIGINAL tests, taken from the first commit, pass
#   hidden_*        tests the agent never sees: the issue's behaviour and the
#                   documented behaviour around it
#   data_untouched  calendar.json is as shipped
# The repository is written once (`&flowcal_repo`) and reused by the other tasks.
# Needs a sandbox image with python3, git and tar (e.g. python:3.12).
# Offline reference solutions: dogfood/agents/offline/swe.yaml.
id: dogfood-swe
name: 'Dogfood: issues in a multi-module repository'
description: Three issues (two bugs, one feature) against the same small calendar library, each judged
  by hidden tests that must start passing and by the repository's original tests, which must keep passing.
version: '1'
repeats: 1
defaults:
  timeout_seconds: 900
  max_steps: 30
tasks:
- id: month-end-drift
  goal: |
    Fix this issue in the `flowcal` repository (the workspace; start with README.md).

    **Monthly event on the 31st moves to the 28th and stays there**

    "Send invoices" in `calendar.json` is monthly, starting 31 January. After February it is
    listed on the 28th of every month:

        $ python3 -m flowcal agenda --from 2026-03-28 --to 2026-03-31
        ...
        2026-03-28 16:00    60m  Send invoices

    `python3 -m flowcal next invoices --after 2026-03-01T00:00` says 28 March as well. The README
    says the event should be on 28 February, then 31 March, 30 April, 31 May. I would guess a
    yearly event on 29 February has the same problem.

    Fix it in the library, not in the data. The existing tests must keep passing
    (`python3 -m unittest discover -s tests`).
  setup:
    files: &flowcal_repo
      README.md: |
        # flowcal

        A small calendar library and command-line tool. Events live in a JSON file
        (`calendar.json` by default); an event may repeat.

            python3 -m flowcal agenda --from 2026-03-02 --to 2026-03-06
            python3 -m flowcal next standup --after 2026-03-02T09:00
            python3 -m flowcal conflicts --from 2026-03-02 --to 2026-03-06

        ## Model

        - All times are naive local times, written `YYYY-MM-DDTHH:MM`.
        - An event has an `id`, a `title`, a `start`, a length in `minutes` and an
          optional `rule`. Zero-length events (reminders) are allowed.
        - A rule has a `freq` (`daily`, `weekly`, `monthly` or `yearly`), an
          `interval` (every N days/weeks/months/years, default 1) and at most one end
          condition: `count` (the series has that many occurrences in total) or
          `until` (a date; the last occurrence starts on or before it).
        - A monthly or yearly event keeps its day of the month. In a month that is
          too short it falls on the last day of that month, and it returns to its own
          day in the next month that has it: an event on the 31st happens on
          31 January, 28 February, 31 March, 30 April.

        ## Windows

        `--from` and `--to` are dates and both are included: the window runs from
        00:00 on `--from` to 24:00 on `--to`. The agenda and the conflict report
        consider every occurrence that overlaps the window, including one that began
        before it and is still running when it opens. A reminder belongs to the
        window when its time lies in it.

        ## Conflicts

        Two occurrences conflict when they share some time. Occurrences that merely
        touch (one ends when the other starts) do not conflict. Every conflicting
        pair is reported once, earlier occurrence first, in agenda order: by the
        first occurrence, then by the second.

        ## Layout

            flowcal/dates.py       parsing, formatting, month arithmetic
            flowcal/model.py       Rule, Event, Occurrence
            flowcal/recurrence.py  expanding a series into occurrences
            flowcal/agenda.py      agenda, conflicts, next occurrence
            flowcal/store.py       the JSON file
            flowcal/cli.py         the command line

        Run the tests with `python3 -m unittest discover -s tests`.
