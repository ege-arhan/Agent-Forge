- id: conflict-report
  goal: |
    Fix this issue in the `flowcal` repository (the workspace; start with README.md).

    **The conflict report is wrong in three ways**

    `python3 -m flowcal conflicts` does not do what the README describes:

    1. Back-to-back meetings are reported: 09:00-10:00 and 10:00-11:00 show up as a conflict.
    2. Pairs are missing. With a workshop 09:00-12:00, a call 09:30-10:30 and a demo
       10:00-11:00 I get "Workshop <-> Call" and "Call <-> Demo", but not "Workshop <-> Demo".
    3. An overnight deployment (Sunday 22:00 to Monday 08:00) is not in Monday's agenda, so
       its clash with Monday's 07:30 breakfast is not reported when I ask for Monday only.

    Fix it in the library. The existing tests must keep passing
    (`python3 -m unittest discover -s tests`).
