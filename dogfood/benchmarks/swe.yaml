        import datetime as dt
        import unittest

        from flowcal.dates import add_months, days_in_month, format_datetime, parse_datetime


        class DatesTests(unittest.TestCase):
            def test_parse_and_format(self):
                value = parse_datetime("2026-03-02T09:30")
                self.assertEqual(value, dt.datetime(2026, 3, 2, 9, 30))
                self.assertEqual(format_datetime(value), "2026-03-02T09:30")

            def test_days_in_month(self):
                self.assertEqual(days_in_month(2026, 2), 28)
                self.assertEqual(days_in_month(2028, 2), 29)

            def test_add_months(self):
                start = dt.datetime(2026, 11, 15, 8, 0)
                self.assertEqual(add_months(start, 1), dt.datetime(2026, 12, 15, 8, 0))
                self.assertEqual(add_months(start, 2), dt.datetime(2027, 1, 15, 8, 0))
                self.assertEqual(add_months(start, 14), dt.datetime(2028, 1, 15, 8, 0))

            def test_add_months_clamps_to_a_shorter_month(self):
                self.assertEqual(
                    add_months(dt.datetime(2026, 1, 31, 16, 0), 1), dt.datetime(2026, 2, 28, 16, 0)
                )


        if __name__ == "__main__":
            unittest.main()
      tests/test_recurrence.py: |
        import datetime as dt
        import itertools
        import unittest

        from flowcal.model import Event, Rule
        from flowcal.recurrence import occurrences, starts


        def event(start, minutes=30, **rule):
            return Event("e", "Event", start, minutes, Rule(**rule) if rule else None)


        class StartsTests(unittest.TestCase):
            def test_single_event(self):
                start = dt.datetime(2026, 3, 2, 9, 0)
                self.assertEqual(list(starts(event(start))), [start])

            def test_daily_with_count(self):
                got = list(starts(event(dt.datetime(2026, 3, 2, 9, 0), freq="daily", interval=2, count=3)))
                self.assertEqual([s.day for s in got], [2, 4, 6])

            def test_weekly_until_is_inclusive(self):
                rule = {"freq": "weekly", "until": dt.date(2026, 3, 16)}
                got = list(starts(event(dt.datetime(2026, 3, 2, 9, 0), **rule)))
                self.assertEqual([s.day for s in got], [2, 9, 16])

            def test_monthly_on_the_15th(self):
                got = itertools.islice(starts(event(dt.datetime(2026, 11, 15, 8, 0), freq="monthly")), 4)
                self.assertEqual([(s.year, s.month, s.day) for s in got],
                                 [(2026, 11, 15), (2026, 12, 15), (2027, 1, 15), (2027, 2, 15)])

            def test_yearly(self):
                got = itertools.islice(starts(event(dt.datetime(2026, 7, 4, 12, 0), freq="yearly")), 3)
                self.assertEqual([s.year for s in got], [2026, 2027, 2028])


        class OccurrencesTests(unittest.TestCase):
            def test_window_is_half_open(self):
                daily = event(dt.datetime(2026, 3, 1, 9, 0), freq="daily")
                got = occurrences(daily, dt.datetime(2026, 3, 3), dt.datetime(2026, 3, 5))
                self.assertEqual([o.start.day for o in got], [3, 4])

            def test_endless_series_stops_at_the_window(self):
                daily = event(dt.datetime(2020, 1, 1, 9, 0), freq="daily")
                got = occurrences(daily, dt.datetime(2026, 3, 3), dt.datetime(2026, 3, 4))
                self.assertEqual(len(got), 1)
                self.assertEqual(got[0].end, dt.datetime(2026, 3, 3, 9, 30))


        if __name__ == "__main__":
            unittest.main()
