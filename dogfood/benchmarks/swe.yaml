                self.assertEqual(store.rule_to_dict(Rule("weekly", 2)), {"freq": "weekly", "interval": 2})
                self.assertEqual(
                    store.rule_to_dict(Rule("daily", until=dt.date(2026, 6, 30))),
                    {"freq": "daily", "interval": 1, "until": "2026-06-30"},
                )

            def test_round_trip(self):
                events = [
                    Event("a", "Alpha", dt.datetime(2026, 3, 2, 9, 0), 45),
                    Event("b", "Beta", dt.datetime(2026, 3, 3, 9, 0), 0, Rule("monthly", 3, count=4)),
                ]
                path = os.path.join(tempfile.mkdtemp(), "calendar.json")
                store.save(path, events)
                self.assertEqual(store.load(path), events)

            def test_shipped_calendar_loads(self):
                events = store.load("calendar.json")
                self.assertEqual([event.id for event in events],
                                 ["standup", "planning", "invoices", "review", "launch"])

            def test_duplicate_ids_are_rejected(self):
                path = os.path.join(tempfile.mkdtemp(), "calendar.json")
                event = Event("a", "Alpha", dt.datetime(2026, 3, 2, 9, 0), 45)
                store.save(path, [event, event])
                with self.assertRaises(ValueError):
                    store.load(path)


        if __name__ == "__main__":
            unittest.main()
