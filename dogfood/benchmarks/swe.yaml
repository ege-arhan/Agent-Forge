      dir=$(mktemp -d)
      git archive "$base" tests | tar -x -C "$dir"
      PYTHONPATH=. python3 -m unittest discover -s "$dir/tests" -t "$dir"
      rm -rf "$dir"
  - type: command
    name: hidden_model_store
    command: |
      set -e
      python3 - <<'PY'
      import datetime as dt
      import json
      import os
      import tempfile

      from flowcal import store
      from flowcal.model import Event, Rule

      plain = Event("a", "Alpha", dt.datetime(2026, 3, 2, 9, 0), 45)
      assert plain.skip == (), plain.skip
      assert "skip" not in store.event_to_dict(plain)

      days = (dt.date(2026, 3, 4), dt.date(2026, 3, 10))
      event = Event("d", "Daily", dt.datetime(2026, 3, 2, 9, 0), 30, Rule("daily"), skip=days)
      assert store.event_to_dict(event)["skip"] == ["2026-03-04", "2026-03-10"]

      path = os.path.join(tempfile.mkdtemp(), "calendar.json")
      with open(path, "w") as handle:
          json.dump({"events": [
              {"id": "d", "title": "Daily", "start": "2026-03-02T09:00", "minutes": 30,
               "rule": {"freq": "daily"}, "skip": ["2026-03-10", "2026-03-04", "2026-03-10"]},
              {"id": "a", "title": "Alpha", "start": "2026-03-02T09:00", "minutes": 45},
          ]}, handle)
      loaded = store.load(path)
      assert tuple(loaded[0].skip) == days, loaded[0].skip
      assert tuple(loaded[1].skip) == ()
      store.save(path, loaded)
      with open(path) as handle:
          saved = json.load(handle)["events"]
      assert saved[0]["skip"] == ["2026-03-04", "2026-03-10"], saved[0]
      assert "skip" not in saved[1], saved[1]
      assert store.load(path) == loaded
      PY
      # A calendar without skipped dates is written back byte for byte.
