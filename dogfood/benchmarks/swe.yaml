        import datetime as dt
        import unittest

        from flowcal.agenda import agenda, conflicts, next_occurrence
        from flowcal.model import Event, Rule

        DAY = (dt.datetime(2026, 3, 2), dt.datetime(2026, 3, 3))


        def at(hour, minute=0, day=2):
            return dt.datetime(2026, 3, day, hour, minute)


        class AgendaTests(unittest.TestCase):
            def test_sorted_by_start_then_title(self):
                events = [
                    Event("b", "Beta", at(11), 30),
                    Event("r", "Reminder", at(10), 0),
                    Event("a", "Alpha", at(11), 60),
                ]
                self.assertEqual([o.event.title for o in agenda(events, *DAY)], ["Reminder", "Alpha", "Beta"])


        class ConflictsTests(unittest.TestCase):
            def test_overlapping_pair(self):
                events = [Event("a", "Alpha", at(9), 60), Event("b", "Beta", at(9, 30), 60)]
                [(first, second)] = conflicts(events, *DAY)
                self.assertEqual((first.event.id, second.event.id), ("a", "b"))

            def test_separate_events_do_not_conflict(self):
                events = [Event("a", "Alpha", at(9), 60), Event("b", "Beta", at(11), 60)]
                self.assertEqual(conflicts(events, *DAY), [])

            def test_recurring_event_conflicts_once_per_day(self):
                events = [
                    Event("a", "Alpha", at(9), 60, Rule("daily", count=3)),
                    Event("b", "Beta", at(9, 30, day=3), 15),
                ]
                pairs = conflicts(events, dt.datetime(2026, 3, 1), dt.datetime(2026, 3, 8))
                self.assertEqual([(a.start.day, b.event.id) for a, b in pairs], [(3, "b")])


        class NextOccurrenceTests(unittest.TestCase):
            def test_single_event(self):
                single = Event("s", "Single", at(9), 30)
                self.assertEqual(next_occurrence(single, at(8)).start, at(9))
                self.assertIsNone(next_occurrence(single, at(9)))

            def test_weekly(self):
                weekly = Event("w", "Weekly", at(9), 30, Rule("weekly"))
                self.assertEqual(next_occurrence(weekly, at(9)).start, at(9, day=9))

            def test_count_and_until_end_the_series(self):
                counted = Event("c", "Counted", at(9), 30, Rule("daily", count=2))
                self.assertEqual(next_occurrence(counted, at(9)).start, at(9, day=3))
                self.assertIsNone(next_occurrence(counted, at(9, day=3)))
                bounded = Event("u", "Until", at(9), 30, Rule("daily", until=dt.date(2026, 3, 3)))
                self.assertIsNone(next_occurrence(bounded, at(9, day=3)))


        if __name__ == "__main__":
            unittest.main()
