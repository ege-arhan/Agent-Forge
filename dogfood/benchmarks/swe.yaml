      flowcal skip standup 2026-03-09 > /dev/null   # again: fine, and nothing changes
      cmp "$cal" "$dir/once.json"
      flowcal skip standup 2026-03-05 > /dev/null
      python3 - "$cal" <<'PY'
      import json, sys
      events = {e["id"]: e for e in json.load(open(sys.argv[1]))["events"]}
      assert events["standup"]["skip"] == ["2026-03-05", "2026-03-09"], events["standup"]
      assert all("skip" not in e for i, e in events.items() if i != "standup"), events
      assert events["standup"]["rule"] == {"freq": "daily", "interval": 1, "until": "2026-06-30"}
      PY

      cp "$cal" "$dir/before.json"
      set +e
      out=$(flowcal skip planning 2026-03-09 2> "$dir/err.txt"); code=$?
      set -e
      test "$code" = 2 && test -z "$out"
      test "$(cat "$dir/err.txt")" = "error: planning has no occurrence on 2026-03-09"
      set +e
      out=$(flowcal skip nope 2026-03-09 2> "$dir/err.txt"); code=$?
      set -e
      test "$code" = 2 && test -z "$out"
      test "$(cat "$dir/err.txt")" = "error: no event 'nope'"
      set +e
      flowcal skip standup 2026-07-01 > /dev/null 2> "$dir/err.txt"; code=$?   # after `until`
      set -e
      test "$code" = 2 && test "$(cat "$dir/err.txt")" = "error: standup has no occurrence on 2026-07-01"
      cmp "$cal" "$dir/before.json"

      flowcal skip launch 2026-03-10 > /dev/null   # a single event can be skipped too
      test -z "$(flowcal agenda --from 2026-03-10 --to 2026-03-10 | grep Launch || true)"
      rm -rf "$dir"
      echo "hidden cli ok"
  - type: command
    name: data_untouched
    command: |
      git diff --quiet "$(git rev-list --max-parents=0 HEAD | tail -n1)" -- calendar.json
  - type: tool_used
    name: ran_commands
    tool: run_command
    required: false
    weight: 0.5
  tags:
  - swe
  - feature
  - multi-file
