        import contextlib
        import io
        import unittest

        from flowcal.cli import main


        def run(*argv):
            out, err = io.StringIO(), io.StringIO()
            with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
                code = main(list(argv))
            return code, out.getvalue(), err.getvalue()


        class CliTests(unittest.TestCase):
            def test_agenda(self):
                code, out, _ = run("agenda", "--from", "2026-03-09", "--to", "2026-03-10")
                self.assertEqual(code, 0)
                self.assertEqual(
                    out.splitlines(),
                    [
                        "2026-03-09 09:30    15m  Standup",
                        "2026-03-10 08:00     0m  Launch",
                        "2026-03-10 09:30    15m  Standup",
                    ],
                )

            def test_next(self):
                code, out, _ = run("next", "planning", "--after", "2026-03-02T10:00")
                self.assertEqual((code, out), (0, "2026-03-16 10:00 Sprint planning\n"))

            def test_next_after_the_series_ended(self):
                code, out, _ = run("next", "review", "--after", "2027-01-01T00:00")
                self.assertEqual((code, out), (1, "no further occurrence\n"))

            def test_unknown_event(self):
                code, out, err = run("next", "nope", "--after", "2026-03-02T10:00")
                self.assertEqual((code, out, err), (2, "", "error: no event 'nope'\n"))

            def test_window_must_not_end_before_it_starts(self):
                code, _, err = run("conflicts", "--from", "2026-03-10", "--to", "2026-03-09")
                self.assertEqual((code, err), (2, "error: --to is before --from\n"))


        if __name__ == "__main__":
            unittest.main()
