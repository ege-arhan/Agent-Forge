      dir=$(mktemp -d)
      git show "$base:calendar.json" > "$dir/before.json"
      python3 -c "import sys; from flowcal import store; store.save(sys.argv[2], store.load(sys.argv[1]))" "$dir/before.json" "$dir/after.json"
      cmp "$dir/before.json" "$dir/after.json"
      rm -rf "$dir"
      echo "hidden model and store ok"
  - type: command
    name: hidden_expansion
    command: |
      python3 - <<'PY'
      import datetime as dt

      from flowcal.agenda import agenda, conflicts, next_occurrence
      from flowcal.model import Event, Rule
      from flowcal.recurrence import occurrences


      def at(day, hour=9, minute=0):
          return dt.datetime(2026, 3, day, hour, minute)


      MARCH = (dt.datetime(2026, 3, 1), dt.datetime(2026, 4, 1))
      skipped = (dt.date(2026, 3, 3), dt.date(2026, 3, 6))
      # count is the length of the series: 2..6 March. Skipping two leaves three, not five.
      counted = Event("c", "Counted", at(2), 30, Rule("daily", count=5), skip=skipped)
      got = [o.start.day for o in occurrences(counted, *MARCH)]
      assert got == [2, 4, 5], got
      assert next_occurrence(counted, at(2)).start == at(4)
      assert next_occurrence(counted, at(4)).start == at(5)
      assert next_occurrence(counted, at(5)) is None

      bounded = Event("u", "Until", at(2), 30, Rule("daily", until=dt.date(2026, 3, 5)), skip=(dt.date(2026, 3, 5),))
      assert [o.start.day for o in occurrences(bounded, *MARCH)] == [2, 3, 4]
      assert next_occurrence(bounded, at(4)) is None

      endless = Event("w", "Weekly", at(2), 30, Rule("weekly"), skip=(dt.date(2026, 3, 9), dt.date(2026, 3, 16)))
      assert next_occurrence(endless, at(2)).start == at(23)
      assert [o.start.day for o in agenda([endless], *MARCH)] == [2, 23, 30]

      single = Event("s", "Single", at(2), 30, skip=(dt.date(2026, 3, 2),))
      assert occurrences(single, *MARCH) == [] and next_occurrence(single, at(1)) is None

      # A date that is not an occurrence, or another event's skipped date, changes nothing.
      other = Event("o", "Other", at(3, 9, 15), 30, skip=(dt.date(2026, 3, 4),))
      got = [(a.event.id, b.event.id, a.start.day) for a, b in conflicts([counted, other], *MARCH)]
      assert got == [], got
      clash = Event("x", "Clash", at(4, 9, 15), 30)
      got = [(a.event.id, b.event.id, a.start.day) for a, b in conflicts([counted, clash], *MARCH)]
      assert got == [("c", "x", 4)], got
      print("hidden expansion ok")
      PY
