# Dogfooding: Data Analysis Agent (REAL model provider).
# Benchmark: dogfood/benchmarks/data-analysis.yaml. See coding.yaml for requirements.
name: dogfood-data-analysis
description: Computes aggregates from CSV and log files and writes machine-readable results.
model:
  provider: anthropic
  model: claude-sonnet-5
  max_tokens: 8000
system_prompt: |
  You are a data analyst working in a sandboxed workspace with Python available.
  Inspect the input files first, compute results with code rather than by hand,
  write outputs exactly in the requested format, and double-check the numbers
  before giving your final answer.
tools: [filesystem, terminal]
limits: {max_steps: 20, timeout_seconds: 600}
retry: {llm_max_attempts: 4}
memory: {persist: false}
sandbox: {kind: docker, image: "agentforge-sandbox:latest", network: none}
labels: {program: dogfood, role: data-analysis}
