# OFFLINE improvement-loop demo agent (scripted provider), version 1.
#
# Same scripted solutions as coding.yaml but with max_steps: 3, too low for
# the tasks. `scripts/dogfood.py offline` benchmarks it, lets the rule-based
# proposer analyse the step-limit failures, applies the proposal as version 2
# and benchmarks again. This demonstrates the loop mechanics only.
#
# Replays a known-good solution for every task in dogfood/benchmarks/coding.yaml.
# Its results validate the benchmark (each task is solvable and its checks
# accept a correct solution) and the AgentForge pipeline. They say nothing
# about any model and are reported separately as OFFLINE results.
name: dogfood-demo-coder
description: 'Improvement-loop demo: coding reference agent with too small a step budget.'
model:
  provider: scripted
  model: scripted-reference-v1
  options:
    turns:
    - text: No scripted solution matches this task.
    rules:
    - when: slugify\(\)
      turns:
      - text: Run the tests first to see the current state.
        tool_calls:
        - name: run_command
          arguments:
            command: python3 test_text_utils.py
      - text: slugify is not implemented yet. Reading the specification.
        tool_calls:
        - name: read_file
          arguments:
            path: text_utils.py
      - text: Implementing slugify with a single regular expression.
        tool_calls:
        - name: write_file
          arguments:
            path: text_utils.py
            content: "import re\n\n\ndef slugify(text: str) -> str:\n    \"\"\"Convert text to a URL slug.\n\
              \n    Lowercase ASCII letters and digits are kept; every run of other\n    characters becomes\
              \ a single hyphen; leading and trailing hyphens\n    are removed. Example: slugify(\"Hello,\
              \ World!\") == \"hello-world\"\n    \"\"\"\n    return re.sub(r\"[^a-z0-9]+\", \"-\", text.lower()).strip(\"\
              -\")\n"
      - text: Verifying.
        tool_calls:
        - name: run_command
          arguments:
            command: python3 test_text_utils.py
      - text: 'Implemented slugify(): lowercase, replace runs of non [a-z0-9] characters with one hyphen,
          strip hyphens. test_text_utils.py passes.'
    - when: --lines
      turns:
      - text: Reading the script.
        tool_calls:
        - name: read_file
          arguments:
            path: wordcount.py
      - text: Adding a --lines flag while keeping the default output.
        tool_calls:
        - name: write_file
          arguments:
            path: wordcount.py
            content: "\"\"\"Count words (or lines) in a text file.\"\"\"\n\nimport argparse\n\n\ndef main()\
              \ -> None:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"\
              path\")\n    parser.add_argument(\n        \"--lines\", action=\"store_true\", help=\"print\
              \ the number of lines instead of words\"\n    )\n    args = parser.parse_args()\n    with\
              \ open(args.path, encoding=\"utf-8\") as handle:\n        text = handle.read()\n    print(len(text.splitlines())\
              \ if args.lines else len(text.split()))\n\n\nif __name__ == \"__main__\":\n    main()\n"
      - text: Checking both modes and the help text.
        tool_calls:
        - name: run_command
          arguments:
            command: python3 wordcount.py sample.txt && python3 wordcount.py --lines sample.txt && python3
              wordcount.py --help
      - text: 'Added --lines (prints the line count; default still prints the word count: 6 words, 4 lines
          for sample.txt) and documented it in --help.'
tools:
- filesystem
- terminal
limits:
  max_steps: 3
  timeout_seconds: 300
memory:
  persist: false
sandbox:
  kind: local
labels:
  program: dogfood
  result_class: offline
  purpose: improvement-loop-demo
