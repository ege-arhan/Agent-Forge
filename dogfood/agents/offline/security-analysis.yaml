# OFFLINE reference agent for the dogfooding program (scripted provider).
#
# Replays a known-good solution for every task in dogfood/benchmarks/security.yaml.
# Its results validate the benchmark (each task is solvable and its checks
# accept a correct solution) and the AgentForge pipeline. They say nothing
# about any model and are reported separately as OFFLINE results.
name: dogfood-security-analysis-offline
description: Scripted reference solutions for the security suite.
model:
  provider: scripted
  model: scripted-reference-v1
  options:
    turns:
    - text: No scripted solution matches this task.
    rules:
    - when: users\.py
      turns:
      - text: Reviewing the code.
        tool_calls:
        - name: read_file
          arguments:
            path: users.py
      - text: 'find_user builds SQL with an f-string from user input: SQL injection (CWE-89). The other
          queries are parameterised.'
        tool_calls:
        - name: write_file
          arguments:
            path: findings.json
            content: |
              [
                {
                  "function": "find_user",
                  "cwe": "CWE-89",
                  "description": "SQL query built with an f-string from the name argument allows SQL injection."
                }
              ]
      - text: Parameterising the query.
        tool_calls:
        - name: edit_file
          arguments:
            path: users.py
            old_text: "    query = f\"SELECT id, name, email FROM users WHERE name = '{name}'\"\n    return\
              \ conn.execute(query).fetchall()"
            new_text: "    query = \"SELECT id, name, email FROM users WHERE name = ?\"\n    return conn.execute(query,\
              \ (name,)).fetchall()"
      - text: Running the tests.
        tool_calls:
        - name: run_command
          arguments:
            command: python3 test_users.py
      - text: 'Found one vulnerability: SQL injection in find_user (CWE-89). Fixed with a parameterised
          query; tests pass. Reported in findings.json.'
    - when: settings\.py
      turns:
      - text: Reviewing settings.py.
        tool_calls:
        - name: read_file
          arguments:
            path: settings.py
      - text: DB_PASSWORD is hard-coded (CWE-798). Reading it from the environment at call time instead.
        tool_calls:
        - name: write_file
          arguments:
            path: settings.py
            content: |
              import os

              DB_HOST = "db.internal"
              DB_USER = "app"


              def dsn():
                  password = os.environ.get("DB_PASSWORD")
                  if not password:
                      raise RuntimeError("the DB_PASSWORD environment variable is not set")
                  return f"postgresql://{DB_USER}:{password}@{DB_HOST}/app"
      - text: Recording the finding.
        tool_calls:
        - name: write_file
          arguments:
            path: findings.json
            content: |
              [
                {
                  "file": "settings.py",
                  "cwe": "CWE-798",
                  "description": "Hard-coded database password; now read from the DB_PASSWORD environment variable."
                }
              ]
      - text: Verifying both cases.
        tool_calls:
        - name: run_command
          arguments:
            command: DB_PASSWORD=x python3 -c 'import settings; print(settings.dsn())' && ! python3 -c
              'import settings; settings.dsn()' 2>/dev/null
      - text: 'Removed the hard-coded credential (CWE-798): dsn() reads DB_PASSWORD and raises a clear
          error when it is missing. Finding recorded in findings.json.'
tools:
- filesystem
- terminal
limits:
  max_steps: 20
  timeout_seconds: 300
memory:
  persist: false
sandbox:
  kind: local
labels:
  program: dogfood
  result_class: offline
