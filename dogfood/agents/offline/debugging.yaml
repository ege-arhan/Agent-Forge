# OFFLINE reference agent for the dogfooding program (scripted provider).
#
# Replays a known-good solution for every task in dogfood/benchmarks/debugging.yaml.
# Its results validate the benchmark (each task is solvable and its checks
# accept a correct solution) and the AgentForge pipeline. They say nothing
# about any model and are reported separately as OFFLINE results.
name: dogfood-debugging-offline
description: Scripted reference solutions for the debugging suite.
model:
  provider: scripted
  model: scripted-reference-v1
  options:
    turns:
    - text: No scripted solution matches this task.
    rules:
    - when: test_pagination\.py
      turns:
      - text: Reproducing the failure.
        tool_calls:
        - name: run_command
          arguments:
            command: python3 test_pagination.py
      - text: paginate(items, 1, 3) is wrong. Reading pagination.py.
        tool_calls:
        - name: read_file
          arguments:
            path: pagination.py
      - text: 'Pages are 1-based but the offset uses page * per_page: off-by-one.'
        tool_calls:
        - name: edit_file
          arguments:
            path: pagination.py
            old_text: start = page * per_page
            new_text: start = (page - 1) * per_page
      - text: page_count rounds down with //; it must round up.
        tool_calls:
        - name: edit_file
          arguments:
            path: pagination.py
            old_text: return total // per_page
            new_text: return -(-total // per_page)
      - text: Re-running the tests.
        tool_calls:
        - name: run_command
          arguments:
            command: python3 test_pagination.py
      - text: 'Two root causes: an off-by-one error (1-based pages used page * per_page instead of (page
          - 1) * per_page) and page_count rounding down instead of up (ceil). Both fixed; tests pass.'
    - when: test_inventory\.py
      turns:
      - text: Reproducing the failure.
        tool_calls:
        - name: run_command
          arguments:
            command: python3 test_inventory.py
      - text: Reading inventory.py.
        tool_calls:
        - name: read_file
          arguments:
            path: inventory.py
      - text: The default list is created once and shared by all instances. Using None as the default.
        tool_calls:
        - name: edit_file
          arguments:
            path: inventory.py
            old_text: "def __init__(self, items=[]):\n        self.items = items"
            new_text: "def __init__(self, items=None):\n        self.items = list(items) if items is not\
              \ None else []"
      - text: Re-running the tests.
        tool_calls:
        - name: run_command
          arguments:
            command: python3 test_inventory.py
      - text: 'Root cause: a mutable default argument (items=[]) shared between instances. Replaced it
          with None and a fresh list per instance; tests pass.'
tools:
- filesystem
- terminal
limits:
  max_steps: 20
  timeout_seconds: 300
memory:
  persist: false
sandbox:
  kind: local
labels:
  program: dogfood
  result_class: offline
