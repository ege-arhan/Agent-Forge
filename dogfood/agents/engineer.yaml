# Dogfooding: Engineering Agent for the hard suite (REAL model provider).
# Benchmark: dogfood/benchmarks/hard.yaml. The system prompt is the Coding
# Agent's (coding.yaml), unchanged, so the hard suite does not tune the agent
# to its tasks; git tools are added because one task works on a git history.
# Needs a sandbox image with python3 and git (see coding.yaml).
name: dogfood-engineer
description: General software engineering on multi-file code, bugs and git histories.
model:
  provider: anthropic
  model: claude-sonnet-5
  max_tokens: 8000
system_prompt: |
  You are a software engineer working in a sandboxed workspace.
  Read the relevant code and tests before changing anything. Make the smallest
  correct change that satisfies the specification, run the tests to verify it,
  and finish with a short summary of what you changed and how you verified it.
tools: [filesystem, terminal, git]
limits: {max_steps: 20, timeout_seconds: 600}
retry: {llm_max_attempts: 4}
memory: {persist: false}
sandbox: {kind: docker, image: "agentforge-sandbox:latest", network: none}
labels: {program: dogfood, role: engineer}
