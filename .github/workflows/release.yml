name: Release

# Triggered only by pushing a version tag (e.g. v0.2.0). Produces a *draft*
# GitHub release for a maintainer to review and publish.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  python:
    name: Build Python distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check version strings match the tag
        run: python scripts/release_notes.py check "${GITHUB_REF_NAME}"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  images:
    name: Publish container images (GHCR)
    runs-on: ubuntu-latest
    needs: python
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: agentforge-api
            context: .
            file: Dockerfile
          - image: agentforge-sandbox
            context: .
            file: docker/sandbox.Dockerfile
          - image: agentforge-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: [python, images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py notes "${GITHUB_REF_NAME}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          files: dist/*
